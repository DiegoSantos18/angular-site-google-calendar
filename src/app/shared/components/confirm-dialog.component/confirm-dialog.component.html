<h2 mat-dialog-title>
  @if (data.icon) {
    <mat-icon aria-hidden="true">{{ data.icon }}</mat-icon>
  }
  {{ data.title }}
</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)">
    {{ data.cancelLabel || 'Cancelar' }}
  </button>
  <button mat-flat-button [color]="data.confirmColor || 'primary'" type="button" (click)="close(true)">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
